spring.application.name=student-management-backend

# Listen on all network interfaces so the phone / emulator can reach the laptop
server.address=0.0.0.0
server.port=8080

# ---------- Database (PostgreSQL) ----------
# Create the database once with:  CREATE DATABASE studentdb;
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate creates / updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT ----------
# Base64-encoded 256-bit secret (change it for production)
app.jwt.secret=${JWT_SECRET:c3R1ZGVudC1tYW5hZ2VtZW50LXN5c3RlbS1qd3Qtc2VjcmV0LWtleS0yMDI2IQ==}
# Token lifetime: 7 days (in milliseconds)
app.jwt.expiration-ms=604800000

# Insert a demo teacher and students on first start (only when the users table is empty)
app.seed-demo-data=true

# Hide harmless "constraint does not exist, skipping" notices Hibernate prints when it first creates tables
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
